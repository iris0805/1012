<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Turtle 3D Model</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* 深色背景 */
            overflow: hidden; /* 隱藏卷軸 */
        }
        .sketchfab-embed-wrapper {
            width: 100vw;
            height: 100vh;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="sketchfab-embed-wrapper">
        <!-- 替換 src 中的 ID (d2c766bc36724d5998b62f8b2150acb9) 即可更換不同模型 -->
        <!-- 加上 autostart=1 讓模型自動載入，ui_theme=dark 讓介面呈現深色 -->
        <iframe title="Sea Turtle - Animated - Low Poly" 
            frameborder="0" 
            allowfullscreen 
            mozallowfullscreen="true" 
            webkitallowfullscreen="true" 
            allow="autoplay; fullscreen; xr-spatial-tracking" 
            xr-spatial-tracking 
            execution-while-out-of-viewport 
            execution-while-not-rendered 
            web-share 
            src="https://sketchfab.com/models/d2c766bc36724d5998b62f8b2150acb9/embed?autostart=1&ui_theme=dark">
        </iframe>
    </div>

</body>
</html>
